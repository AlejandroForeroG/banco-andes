[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banco-andes"
version = "0.1.0"
description = "Financial guidance with independent review, memory, and MCP"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
bank-agent = "cli.main:cli"

[tool.setuptools]
packages = ["cli", "agent", "agent.memory", "agent.reasoning", "reviewer", "mcp_server", "observability"]
py-modules = ["contract"]

[tool.setuptools.package-data]
reviewer = ["*.sql", "data/*.sqlite3"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "review: contract, security, and two-agent integration",
    "cli: environment, CLI, and configuration",
    "tools: tools, agent graph, and MCP server",
    "observability: LangSmith observability (requires credentials)",
    "memory: short-term and long-term memory",
    "reasoning: task decomposition (ReAct / Plan-and-Execute)",
]
